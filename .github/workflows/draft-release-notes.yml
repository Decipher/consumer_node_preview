name: Draft release notes

on:
  push:
    tags:
      - '*'
    # Release lines such as 1.0.x and 2.0.x. The scaffold's 1.x matched no
    # branch here.
    branches:
      - '*.x'

permissions:
  contents: read

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-24.04

    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
