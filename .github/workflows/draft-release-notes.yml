name: Draft release notes

on:
  push:
    tags:
      - '*'
    # Release lines such as 1.0.x and 2.0.x. The scaffold's 1.x matched no
    # branch here.
    branches:
      - '*.x'

permissions:
  contents: read

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-26.04

    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
