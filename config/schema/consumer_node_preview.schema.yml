consumer_node_preview.settings:
  type: config_object
  label: 'Consumer Node Preview settings'
  mapping:
    allowed_target_hosts:
      type: sequence
      label: 'Allowed target hosts'
      sequence:
        type: string
        label: 'Host, or a *. pattern for its subdomains'
    token_lifetime:
      type: integer
      label: 'Seconds a preview token lasts'
      constraints:
        Range:
          min: 1
    inactive_after:
      type: integer
      label: 'Seconds after its last registration that a target goes inactive'
      constraints:
        Range:
          min: 1
    delete_after:
      type: integer
      label: 'Seconds after its last registration that cron deletes a target'
      constraints:
        Range:
          min: 1
