services:
  consumer_node_preview.route_subscriber:
    class: Drupal\consumer_node_preview\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }

  consumer_node_preview.targets_provider:
    class: Drupal\consumer_node_preview\PreviewTargetsProvider
    arguments:
      - '@entity_type.manager'
      - '@jsonapi.resource_type.repository'
      - '@entity_field.manager'
      - '@datetime.time'
      - '@consumer_node_preview.preview_token'
      - '@config.factory'
      - '@logger.channel.consumer_node_preview'

  logger.channel.consumer_node_preview:
    parent: logger.channel_base
    arguments: ['consumer_node_preview']

  consumer_node_preview.preview_token:
    class: Drupal\consumer_node_preview\PreviewToken
    arguments:
      - '@current_user'
      - '@datetime.time'
      - '@config.factory'
      - '@?simple_oauth.repositories.access_token'
      - '@?simple_oauth.repositories.client'
      - '@?simple_oauth.repositories.scope'

  # Keeps a consumer's tokens when only its preview targets or layouts change.
  # Simple OAuth is optional, so without it there is nothing to decorate.
  consumer_node_preview.token_expiry_trigger_handler:
    class: Drupal\consumer_node_preview\PreviewTargetsTokenExpiryTriggerHandler
    decorates: Drupal\simple_oauth\TokenExpiryTriggerHandlerInterface
    decoration_on_invalid: ignore
    arguments: ['@.inner', '@consumer_node_preview.preview_field_changes']

  consumer_node_preview.preview_field_changes:
    class: Drupal\consumer_node_preview\PreviewFieldChanges
    arguments: ['@entity_type.manager']
